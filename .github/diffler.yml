version: "1"

github:
  username: LukasParke
  token: "${GITHUB_TOKEN}"

templates:
  directory: templates
  main: profile.md.j2
  builtins: false

assets:
  baseUrl: https://lukasparke.github.io/diffler
  format: webp

# Stats collection and card rendering run in LukasParke/stats and Diffler Pages.
# This profile job groups the public repository snapshot and refreshes posts
# and community links through Diffler's prefetched template helpers.
statsAction:
  includeTraffic: false
  includeRestRepoStats: false
  includePrivateRepositoryMetrics: false
  includePrivateRepositoryDetails: false
  includePrivateCacheDetails: false
  backfillMode: "off"
